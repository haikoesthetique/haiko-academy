[build]
  publish = "."
  # Toujours construire : la détection automatique "pas de changement" se trompe
  # avec le nom de dossier "site-html 14" et annulait chaque déploiement.
  ignore = "exit 1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/catalogue.js"]

[[headers]]
  for = "/brochure-cap-esthetique-2027.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
